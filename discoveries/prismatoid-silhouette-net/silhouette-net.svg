<svg xmlns="http://www.w3.org/2000/svg" width="820" height="467" viewBox="0 0 820 467" role="img" aria-labelledby="title desc">
<title id="title">The silhouette seam of an alternating prismatoid</title>
<desc id="desc">Left, two alternating projected pentagons cross ten times inside a decagon. Right, at height 14, the two developed caps fit opposite sides of their one shared edge, with no overlap.</desc>
<rect width="820" height="467" rx="22" fill="#f5f8fc"/>
<rect x="17" y="17" width="387" height="433" rx="14" fill="#fff" stroke="#dae4ef"/><rect x="416" y="17" width="387" height="433" rx="14" fill="#fff" stroke="#dae4ef"/>
<g font-family="system-ui, sans-serif" fill="#14273d"><text x="36" y="53" font-size="21" font-weight="700">1. Look straight down</text><text x="36" y="80" font-size="14" fill="#435b72">Two pentagons, ten crossings</text><text x="435" y="53" font-size="21" font-weight="700">2. Unfold at height 14</text><text x="435" y="80" font-size="14" fill="#435b72">The two caps share only the marked seam</text></g>
